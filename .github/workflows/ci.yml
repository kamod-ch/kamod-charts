name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Verify package exports
        run: node scripts/test-package-exports.mjs

      - name: Build docs
        run: pnpm docs:build

      - name: Generate bundle size report
        run: pnpm size:report

      - name: Verify bundle size report is committed
        run: git diff --exit-code -- docs/bundle-size.md
