packages:
  - "packages/*"
allowBuilds:
  esbuild: false
packageExtensions:
  tsup:
    dependencies:
      typescript: "npm:@typescript/typescript6@6.0.2"
overrides:
  "tsup>typescript:peer": "-"
peerDependencyRules:
  allowedVersions:
    "@kamod-ch/motion>motion": "^14.4.0"
    "@kamod-ch/motion>preact": "^11.0.1"
    "@kamod-ch/themes>preact": "^11.0.1"
minimumReleaseAgeExclude:
  - "@kamod-ch/brand@0.1.11 || 0.1.12"
  - "@kamod-ch/preactpress@3.2.0"
